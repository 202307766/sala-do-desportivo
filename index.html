<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala AEFEUP</title>
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<style>
/* Simples: fundo branco, logótipo em cima, botões e listas. Cor única: o vermelho da AEFEUP. */
:root{
  --red:#a83520; --red-soft:#f7ebe8; --going:#d08a2c; --going-soft:#fbf1e3;
  --bg:#ffffff; --fg:#2a2220; --muted:#857571; --line:#eee6e4;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45}
.page{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:28px;
  padding:calc(env(safe-area-inset-top,0px) + 28px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(20px,env(safe-area-inset-left,0px))}
header{display:flex;flex-direction:column;gap:14px}
.logo{width:150px;height:auto}
.summary{margin:0;font-size:20px;font-weight:600}
.summary b{color:var(--red)}
.card{display:flex;flex-direction:column;gap:10px}
.hello{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--muted);font-size:15px}
.hello button{font:inherit;font-size:14px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{font:600 15px var(--body);padding:13px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.opts button[aria-pressed="true"][data-s="in"]{background:var(--red);border-color:var(--red);color:#fff}
.opts button[aria-pressed="true"][data-s="going"]{background:var(--going);border-color:var(--going);color:#fff}
.opts button[aria-pressed="true"][data-s="out"]{border-color:var(--fg)}
.namebox{display:flex;gap:8px}
.namebox input{flex:1;min-width:0;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--line);color:var(--fg);background:var(--bg)}
.namebox button{font:600 15px var(--body);padding:0 18px;border-radius:10px;border:0;background:var(--red);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 2px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:12px;color:#fff;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding:0 6px;letter-spacing:0}
#h-in .n{background:var(--red)}
#h-going .n{background:var(--going)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;color:var(--red);background:var(--red-soft)}
.going .av{color:var(--going);background:var(--going-soft)}
.name{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.you,.ex{font-weight:400;color:var(--muted);font-size:13px}
.t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.none{color:var(--muted);border:0}
.note{font-size:13px;color:var(--muted);margin:0;text-align:center}
</style>
</head>

    <p class="summary" id="summary">A carregar…</p>
  </header>

  <section class="card">
    <form class="namebox" id="namebox" hidden>
      <input id="nameinput" maxlength="30" placeholder="O teu nome" autocomplete="given-name" required>
      <button type="submit">Entrar</button>
    </form>
    <div class="hello" id="me" hidden><span id="hello"></span><button id="rename" type="button">mudar nome</button></div>
    <div class="opts" id="opts" hidden>
      <button data-s="in" aria-pressed="false">Estou lá</button>
      <button data-s="going" aria-pressed="false">Vou lá</button>
      <button data-s="out" aria-pressed="false">Não estou</button>
    </div>
  </section>

  <section>
    <h2 id="h-in">Na sala <span class="n" id="n-in">0</span></h2>
    <ul id="in"></ul>
  </section>
  <section>
    <h2 id="h-going">A caminho <span class="n" id="n-going">0</span></h2>
    <ul id="going" class="going"></ul>
  </section>

  <p class="note" id="note"></p>
</div>

<script type="module">
// ===== Configuração do Firebase =====
// Cola aqui os dados do teu projeto (Firebase > Definições do projeto > As tuas apps > Web).
// Enquanto estiver vazio, o site funciona em modo de demonstração (só neste telemóvel).
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  databaseURL: "https://sala-do-desportivo-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "",
  appId: ""
};

const STALE = { in: 10 * 3600e3, going: 2 * 3600e3 };
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};

let myId = store.get("sala.id");
if (!myId) { myId = (crypto.randomUUID?.() || String(Math.random()).slice(2)).replace(/-/g,""); store.set("sala.id", myId); }
let myName = store.get("sala.name") || "";
let people = {};
let save;

const status = p => {
  if (!p || typeof p.since !== "number") return "out";
  if ((p.s === "in" || p.s === "going") && Date.now() - p.since < STALE[p.s]) return p.s;
  return "out";
};
const ago = ms => {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 1) return "agora";
  if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `há ${h}h${String(r).padStart(2,"0")}` : `há ${h}h`;
};

function render() {
  const named = !!myName;
  $("namebox").hidden = named;
  $("me").hidden = !named;
  $("opts").hidden = !named;
  $("hello").textContent = named ? `Olá, ${myName}` : "";

  const mine = status(people[myId]);
  document.querySelectorAll(".opts button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === mine)));

  const groups = { in: [], going: [] };
  for (const [id, p] of Object.entries(people)) { const s = status(p); if (groups[s]) groups[s].push({ id, ...p }); }
  for (const k of ["in", "going"]) {
    const ul = $(k); ul.innerHTML = "";
    const list = groups[k].sort((a, b) => a.since - b.since);
    $("n-" + k).textContent = list.length;
    if (!list.length) {
      const li = document.createElement("li"); li.className = "none";
      li.textContent = k === "in" ? "Ninguém na sala." : "Ninguém a caminho.";
      ul.append(li); continue;
    }
    for (const p of list) {
      const li = document.createElement("li");
      const av = document.createElement("span"); av.className = "av"; av.textContent = (String(p.name || "?").trim()[0] || "?").toUpperCase();
      const n = document.createElement("span"); n.className = "name"; n.textContent = String(p.name || "Alguém").slice(0, 30) + " ";
      if (p.id === myId) { const y = document.createElement("span"); y.className = "you"; y.textContent = "(tu)"; n.append(y); }
      if (p.example) { const y = document.createElement("span"); y.className = "ex"; y.textContent = "(exemplo)"; n.append(y); }
      const t = document.createElement("span"); t.className = "t"; t.textContent = ago(p.since);
      li.append(av, n, t); ul.append(li);
    }
  }
  const nIn = groups.in.length, nGo = groups.going.length;
  const sm = $("summary"); sm.textContent = "";
  if (nIn === 0 && nGo === 0) sm.textContent = "A sala está vazia.";
  else {
    const b = document.createElement("b"); b.textContent = nIn === 1 ? "1 pessoa" : nIn + " pessoas";
    sm.append(b, " na sala" + (nGo ? `, ${nGo} a caminho.` : "."));
  }
}

$("namebox").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("nameinput").value.trim().slice(0, 30);
  if (!v) return;
  myName = v; store.set("sala.name", v);
  if (people[myId]) save({ ...people[myId], name: v });
  render();
});
$("rename").addEventListener("click", () => { $("nameinput").value = myName; myName = ""; render(); $("nameinput").focus(); });
document.querySelectorAll(".opts button").forEach(b => b.addEventListener("click", () => {
  save({ name: myName, s: b.dataset.s, since: Date.now() });
}));

const configured = !!firebaseConfig.databaseURL;
if (configured) {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getDatabase, ref, onValue, set } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const cfg = Object.fromEntries(Object.entries(firebaseConfig).filter(([, v]) => v));
    const db = getDatabase(initializeApp(cfg));
    save = async data => {
      try { await set(ref(db, "sala/" + myId), data); $("note").textContent = ""; }
      catch { $("note").textContent = "Não deu para guardar. Verifica a internet e tenta outra vez."; }
    };
    onValue(ref(db, "sala"), snap => { people = snap.val() || {}; render(); },
      () => { $("note").textContent = "Sem ligação à base de dados."; });
  } catch {
    $("note").textContent = "Não foi possível ligar. Recarrega a página.";
  }
} else {
  // Modo de demonstração: dados só neste dispositivo.
  people = {};
  const saved = store.get("sala.demo"); if (saved) try { people[myId] = JSON.parse(saved); } catch {}
  save = data => { people[myId] = data; store.set("sala.demo", JSON.stringify(data)); render(); };
  $("note").textContent = "Modo de demonstração: ainda não está ligado ao Firebase.";
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
